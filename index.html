<script>
(function(){
'use strict';

/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const roc = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return (y - 1911) + '/' + m + '/' + d; };
const md = iso => iso ? (+iso.slice(5, 7)) + '/' + iso.slice(8, 10) : '';
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,\s$]/g, '')); return isFinite(n) ? n : 0; };
const grp = (n, d = 0) => (isFinite(n) ? n : 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
// 顯示幣別：帳本一律以新台幣記錄，切到日幣／美元時用台灣銀行即期中價換算後顯示

function jpyRate() { return (MARKET && MARKET.fx && MARKET.fx.JPY) || 0.2; }
function twTx(t) {

const fxAmt = (c, n) => S.settings.hide ? '＊＊＊＊' : FX_CURS[c][1] + grp(n, Math.abs(n % 1) > 0.001 ? 2 : 0);

function taxRate(code, date) {
  code = (code || '').toUpperCase();
  if (isJP(code)) return 0;
  if (/^00\d+[A-Z]*B$/.test(code)) return (date || todayISO()) <= '2026-12-31' ? 0 : 0.001;

function sharesAt(a, code, date) { // shares held at the start of `date` (trades on that date excluded)
  let sh = 0;
  for (const t of a.txns) if (t.code === code && t.date < date) {
    if (t.type === 'buy' || t.type === 'stock') sh += t.shares;

function payDateOf(t) {
  const m = /(?:(\d{2,3})\/)?(\d{1,2})\/(\d{1,2})\s*配發/.exec(t.memo || '');
  if (!m) return t.date;
  let y = m[1] ? +m[1] + 1911 : +t.date.slice(0, 4); const mo = +m[2], d = +m[3];
  if (!m[1] && mo < +t.date.slice(5, 7)) y++;

function donut(m) {
  let items;
  if (V.metric === 'div') items = m.divs.filter(d => d.cash > 0).map(d => [d.code, d.cash]);
  else if (V.metric === 'cost') items = m.holds.map(h => [h.code, h.cost]);
  else items = m.holds.map(h => [h.code, h.mv]);
  items.sort((x, y) => y[1] - x[1]);
  if (items.length > 6) { const rest = items.slice(5).reduce((s, x) => s + x[1], 0); items = items.slice(0, 5).concat([['其他', rest]]); }
  const total = items.reduce((s, x) => s + x[1], 0);
  if (!total) return `<div class="empty">還沒有資料</div>`;
  const C = 2 * Math.PI * 54; let accl = 0;
  const cols = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
  const circles = items.map(([c, v], i) => { const len = C * v / total; const s = `<circle cx="70" cy="70" r="54" fill="none" stroke="var(${cols[i]})" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-accl).toFixed(2)}" transform="rotate(-90 70 70)"/>`; accl += len; return s; }).join('');
  const label = { div: '累計股息', cost: '持有成本', mv: '總市值' }[V.metric];
  return `<div style="display:flex;align-items:center;gap:16px">
    <div style="position:relative;width:140px;height:140px;flex:none"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${label}佔比"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--line2)" stroke-width="22"/>${circles}</svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="small">${label}</span><span class="num" style="font-weight:600">${money(total)}</span></div></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">${items.map(([c, v], i) => `<div style="display:flex;align-items:center;gap:8px;font-size:13px"><i style="width:10px;height:10px;border-radius:3px;background:var(${cols[i]});flex:none"></i><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b class="num" style="font-weight:600">${esc(c)}</b> ${esc(stockName(c))}</span><span class="num" style="font-weight:600">${grp(v / total * 100, 1)}%</span></div>`).join('')}</div></div>`;
}

function divChart(list) {

  const W = 340, H = 170, L = 40, R = 8, T = 20, B = 40, n = list.length;
  const maxP = Math.max(...list.map(t => t.perShare || 0)) || 1, maxS = Math.max(...list.map(t => t.shares || 0)) || 1;
  const step = (W - L - R) / n, bw = Math.min(54, step * 0.6);
  const yP = v => T + (H - T - B) * (1 - v / maxP), yS = v => T + 26 + (H - T - B - 26) * (1 - v / maxS);
  let g = `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/><line x1="${L}" x2="${W - R}" y1="${T}" y2="${T}" stroke="var(--line2)"/>`;
  g += `<text x="${L - 6}" y="${T + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Outfit">${maxP}</text><text x="${L - 6}" y="${H - B + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Outfit">0</text>`;
  const pts = [];
  list.forEach((t, i) => {
    const cx = L + step * i + step / 2, y = yS(t.shares);
    g += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y).toFixed(1)}" rx="4" fill="var(${i === n - 1 ? '--gold' : '--gold-bar'})"/>`;
    g += `<text x="${cx.toFixed(1)}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Outfit">${md(t.date)}</text>`;
    if (n <= 6) g += `<text x="${cx.toFixed(1)}" y="${H - B + 27}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Outfit">${grp(t.shares / 1000, t.shares % 1000 ? 1 : 0)}張</text>`;
    pts.push([cx, yP(t.perShare || 0)]);
  });
  g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  pts.forEach(p => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--accent)"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="近 ${n} 次配息的每股現金與除息股數">${g}</svg>`;
}

/* ---------- 股息歷程 ---------- */
function monthly(a) {
  const yrs = {};
  const Y = y => yrs[y] || (yrs[y] = { div: Array(12).fill(0), loan: Array(12).fill(0), inv: Array(12).fill(0), fee: Array(12).fill(0), gain: Array(12).fill(0), count: 0, costEnd: Array(12).fill(null) });
  const pos = {}; let cost = 0;
  for (const t of sortTx(a.txns.map(twTx))) {
    const y = t.date.slice(0, 4), mi = +t.date.slice(5, 7) - 1, o = Y(y);
    const p = t.code ? (pos[t.code] || (pos[t.code] = { sh: 0, cost: 0 })) : null;
    if (t.type === 'cash') { o.div[mi] += origOf(t); o.loan[mi] += (t.interest || 0) + (t.other || 0) + (t.wtax || 0); o.count++; }
    if (t.type === 'loan') o.loan[mi] += t.amount;
    if (t.type === 'buy') { const c = t.shares * t.price + (t.fee || 0); o.inv[mi] += c; o.fee[mi] += t.fee || 0; p.sh += t.shares; p.cost += c; cost += c; }
    if (t.type === 'sell') { const sh = Math.min(t.shares, p.sh), avg = p.sh ? p.cost / p.sh : 0; o.fee[mi] += (t.fee || 0) + (t.tax || 0); o.gain[mi] += sh * t.price - (t.fee || 0) - (t.tax || 0) - avg * sh; p.cost -= avg * sh; p.sh -= sh; cost -= avg * sh; }
    if (t.type === 'stock') p.sh += t.shares;
    o.costEnd[mi] = cost;
  }
  return yrs;
}

  } else {
    const y = years[0], o = yrs[y], tot = o.div.reduce((s, v) => s + v, 0), loan = o.loan.reduce((s, v) => s + v, 0);

/* ---------- 行事曆 ---------- */
function calEvents(a, m) {
  // 只放持有股票的除權息日與配發日；金額為原始股利（配發現金，未扣匯費）
  const out = [], today = todayISO();
  for (const code in S.stocks) {
    const st = S.stocks[code], hold = m.holds.find(h => h.code === code);
    for (const e of st.events) {
      const sh = e.ex <= today ? sharesAt(a, code, e.ex) : (hold ? hold.shares : 0);
      if (!(sh > 0)) continue;
      const gross = Math.round(sh * (e.cash || 0));
      const fee = gross >= 20000 && S.settings.nhiOn ? Math.round(gross * 0.0211) : 0;
      const rec = a.txns.find(t => t.type === 'cash' && t.ev === e.id);
      const amt = rec ? origOf(rec) : gross;
      const stockSh = Math.floor(sh * (e.stock || 0) / 10);
      const it = { code, e, sh, amt, stockSh, done: !!rec };
      out.push(Object.assign({ type: 'ex', date: e.ex }, it));
      if (e.pay) out.push(Object.assign({ type: 'pay', date: e.pay }, it));
    }
  }
  return out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
}
function calInfo(e) {
  const per = [e.e.cash ? '每股現金 ' + e.e.cash + ' 元' : '', e.e.stock ? '每股股票 ' + e.e.stock + ' 元' : ''].filter(Boolean).join('・');
  return per + (e.stockSh ? '・配股 ' + grp(e.stockSh) + ' 股' : '');
}

/* ---------- 財務自由計畫 ---------- */
function planYears(P, M, yld, g, re, goal) {
  if (!yld || !goal) return null;
  const my = yld / 12, mg = Math.pow(1 + g, 1 / 12) - 1; let a = P;
  for (let i = 1; i <= 600; i++) { const d = a * my; a = a * (1 + mg) + M + (re ? d : 0); if (a * my >= goal) return i / 12; }
  return null;
}

  const yrs = planYears(P, M, yld, g, re, goal);

  const my = yld / 12, mg = Math.pow(1 + g, 1 / 12) - 1; let A = P; const pts = [A * my];
  for (let i = 1; i <= span * 12; i++) { const d = A * my; A = A * (1 + mg) + M + (re ? d : 0); if (i % 12 === 0) pts.push(A * my); }
  const W = 340, H = 180, L = 36, R = 8, T = 12, B = 26, top = Math.max(goal * 1.2, Math.max(...pts)) || 1;
  const x = i => L + (W - L - R) * i / span, yy = v => T + (H - T - B) * (1 - v / top);

  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="每月股息預估曲線"><line x1="${L}" x2="${W - R}" y1="${yy(goal)}" y2="${yy(goal)}" stroke="var(--gold)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${L - 4}" y="${yy(goal) + 3}" text-anchor="end" font-size="10" fill="var(--gold)" font-family="Outfit">${grp(goal / 10000, goal % 10000 ? 1 : 0)}萬</text><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/><path d="${line} L${x(span)} ${H - B} L${L} ${H - B} Z" fill="var(--accent)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${yrs != null ? `<circle cx="${x(yrs).toFixed(1)}" cy="${yy(goal).toFixed(1)}" r="5" fill="var(--gold)"/>` : ''}<text x="${L}" y="${H - 8}" font-size="10" fill="var(--muted)" font-family="Outfit">今年</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Outfit">${span} 年後</text></svg>`;
  return `<div class="top">${backBtn()}<h1>財務自由計畫</h1></div>

    <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <span class="small">每月投入</span>
      ${segBar([[5000, '5千'], [10000, '1萬'], [20000, '2萬'], [30000, '3萬']].map(([v, l]) => [String(v), l]), String(M), 'planM', 4)}
      <div class="grid3">

        <div class="field"><label for="p-g">股價年成長 %</label><input id="p-g" class="num" type="number" step="0.1" value="${V.plan.g}" data-f="planG"></div>

    const bonus = held.has(c) ? 0 : mine.has(c) ? 1 : POPULAR.includes(c) ? 2 : 3;
    out.push([r, bonus, c.length, c, n]);
  }
  out.sort((x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2] || (x[3] < y[3] ? -1 : 1));
  const res = out.filter(x => JP_ON || !isJP(x[3])).slice(0, 5).map(x => ({ code: x[3], name: x[4], held: held.has(x[3]) }));
  const jq = JP_ON && /^\d{3}[0-9A-Z](\.T?)?$/.test(Q) ? Q.replace(/\.T?$/, '') + '.T' : null; // 輸入 4 碼時多一個日股選項
  if (jq && !res.some(x => x.code === jq)) { res.splice(Math.min(res.length, 4), 0, { code: jq, name: TW_NAMES[jq] || '日股（東證）', held: held.has(jq) }); res.length = Math.min(res.length, 5); }
  return res;
}
function hl(text, q) { const i = text.toUpperCase().indexOf(q.toUpperCase()); return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); }
let suggIdx = 0;
// 賣出時：點代號欄就列出目前持股（不含外幣），輸入文字可篩選
function heldSugg(q) {
  const Q = String(q || '').trim().toUpperCase();
  return compute(sheetAcc()).holds.filter(h => !isFX(h.code)).filter(h => !Q || h.code.includes(Q) || String(h.name).toUpperCase().includes(Q))
    .map(h => ({ code: h.code, name: h.name, held: true, shares: h.shares }));
}
function showSugg(q) {
  const box = $('#x-sugg'); if (!box) return;
  if (V.sheet && V.sheet.type === 'sell') {
    const list = heldSugg(q); suggIdx = 0;
    box.innerHTML = list.length ? `<div class="sugg-h">目前持股（點一下帶入）</div>` + list.map((x, i) => `<button type="button" role="option" data-pick="${esc(x.code)}" class="${i === 0 ? 'on' : ''}"><b>${esc(x.code)}</b><span>${esc(x.name)}</span>${isJP(x.code) ? '<span class="tag jp-tag">日股</span>' : ''}<span class="sugg-n num">${grp(x.shares)} 股</span></button>`).join('')
      : `<div class="sugg-h">${String(q || '').trim() ? '目前持股沒有符合的代號' : '這個帳戶目前沒有持股'}</div>`;
    box.hidden = false; return;
  }
  const list = suggestCodes(q);
  if (!list.length || (list.length === 1 && list[0].code === String(q).trim().toUpperCase())) { box.hidden = true; box.innerHTML = ''; return; }
  suggIdx = 0;
  box.innerHTML = list.map((x, i) => `<button type="button" role="option" data-pick="${esc(x.code)}" class="${i === 0 ? 'on' : ''}"><b>${hl(x.code, q.trim())}</b><span>${hl(x.name, q.trim())}</span>${isJP(x.code) ? '<span class="tag jp-tag">日股</span>' : ''}${x.held ? '<span class="tag">持有中</span>' : ''}</button>`).join('');
  box.hidden = false;
}
// 目標張數左右滑：更新圓點、記住目前位置
document.addEventListener('scroll', e => {
  const tr = e.target; if (!tr.classList || !tr.classList.contains('tgt-track')) return;
  const i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth + 12)); V.tgtIdx = i;
  const dots = tr.parentElement.querySelectorAll('.tgt-dots span'); dots.forEach((d, j) => d.classList.toggle('on', j === i));
}, true);
// 目標張數：代號欄的關鍵字建議（代號或名稱）
function tgtSugg(q) {
  const box = $('#tgt-sugg'); if (!box) return;
  q = String(q || '').trim();
  const list = q ? suggestCodes(q) : [];
  if (!list.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = list.map((x, i) => `<button type="button" role="option" data-tpick="${esc(x.code)}" class="${i === 0 ? 'on' : ''}"><b>${hl(x.code, q)}</b><span>${hl(x.name, q)}</span>${isJP(x.code) ? '<span class="tag jp-tag">日股</span>' : ''}${x.held ? '<span class="tag">持有中</span>' : ''}</button>`).join('');
  box.hidden = false;
}
document.addEventListener('input', e => { if (e.target.id === 'tgt-code') tgtSugg(e.target.value); });
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-tpick]');
  if (b) { e.preventDefault(); const el = $('#tgt-code'); el.value = b.dataset.tpick; tgtSugg(''); const l = $('#tgt-lots'); if (l) l.focus(); }
  else if (!e.target.closest('#tgt-code')) tgtSugg('');
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'tgt-code') return;
  const box = $('#tgt-sugg'); if (!box || box.hidden) return;
  const btns = [...box.querySelectorAll('[data-tpick]')]; let i = btns.findIndex(b => b.classList.contains('on'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); i = (i + (e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length; btns.forEach((b, j) => b.classList.toggle('on', j === i)); }
  else if (e.key === 'Enter') { e.preventDefault(); e.target.value = btns[Math.max(0, i)].dataset.tpick; tgtSugg(''); const l = $('#tgt-lots'); if (l) l.focus(); }
  else if (e.key === 'Escape') tgtSugg('');
});
function hideSugg() { const box = $('#x-sugg'); if (box) { box.hidden = true; box.innerHTML = ''; } }
function pickCode(code) {
  const sh = V.sheet, el = $('#x-code'); if (!sh || !el) return;
  el.value = code; sh.code = code;
  if (!sh.nameTouched) { delete sh.f.name; const n = $('#x-name'); if (n) n.value = stockName(code); }
  for (const k of ['cash', 'other', 'stockSh', 'held', 'per', 'perStock', 'wtax']) delete sh.f[k];
  sh.cashTouched = sh.sshTouched = sh.otherTouched = sh.wtaxTouched = false; sh.ev = null; sh.filledFor = null;
  hideSugg(); if (sheetLayoutChanged()) renderSheet(); else refreshSheetTotals();
}
function sheetLayoutChanged() { const sh = V.sheet, j = isJP(sh.code); if (!!sh.wasJP === j) return false; sh.wasJP = j; return true; }
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-pick]'); if (b) { e.preventDefault(); pickCode(b.dataset.pick); } else if (!e.target.closest('#x-code') && !e.target.closest('#x-sugg')) hideSugg(); });
document.addEventListener('focusin', e => { if (e.target.id === 'x-code' && V.sheet && V.sheet.type === 'sell') showSugg(e.target.value); });
document.addEventListener('click', e => { if (e.target.id === 'x-code' && V.sheet && V.sheet.type === 'sell') showSugg(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.target.id !== 'x-code') return;
  const box = $('#x-sugg'); if (!box || box.hidden) return;
  const btns = [...box.querySelectorAll('[data-pick]')]; if (!btns.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); suggIdx = (suggIdx + (e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length; btns.forEach((b, i) => b.classList.toggle('on', i === suggIdx)); }
  else if (e.key === 'Enter') { e.preventDefault(); pickCode(btns[suggIdx].dataset.pick); }
  else if (e.key === 'Escape') hideSugg();
});
function refreshSheetTotals() { // update computed parts only; never touch the field being typed in
  const root = $('#sheetRoot'), tmp = document.createElement('div');
  tmp.innerHTML = renderSheet(true);
  tmp.querySelectorAll('[data-live]').forEach(n => { const o = root.querySelector(`[data-live="${n.dataset.live}"]`); if (o && o.innerHTML !== n.innerHTML) o.innerHTML = n.innerHTML; });
  tmp.querySelectorAll('input[id]').forEach(n => { const o = document.getElementById(n.id); if (o && o !== document.activeElement && o.value !== n.value) o.value = n.value; });
}
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.accounts) || !d.stocks) throw 0;
      if (d.merge === 'append') { // 追加匯入：只把檔案內的帳戶交易加進同名帳戶，其他資料不動
        const m = JSON.parse(JSON.stringify(S)); let added = 0, updated = 0;
        d.accounts.forEach(fa => {
          let ta = m.accounts.find(x => x.name === fa.name);
          if (!ta) { ta = Object.assign({}, fa, { txns: [] }); m.accounts.push(ta); }
          else if (fa.applySettings) ['disc', 'min'].forEach(k => { if (fa[k] != null) ta[k] = fa[k]; });
          const ids = new Set((ta.txns || []).map(t => t.id)); ta.txns = ta.txns || [];
          (fa.txns || []).forEach(t => { if (!ids.has(t.id)) { ta.txns.push(t); added++; } else { const i = ta.txns.findIndex(x => x.id === t.id); if (JSON.stringify(ta.txns[i]) !== JSON.stringify(t)) { ta.txns[i] = t; updated++; } } });
        });
        Object.keys(d.stocks).forEach(c => { if (!m.stocks[c]) m.stocks[c] = d.stocks[c]; });
        S = normalize(m); mode = store && store.kind === 'db' ? 'saved' : 'local'; persist(); render();
        toast(`${d.accounts.map(a => a.name).join('、')}：新增 ${added} 筆${updated ? `、更新 ${updated} 筆` : ''}`);
        e.target.value = ''; return;
      }
      S = normalize(d); mode = store && store.kind === 'db' ? 'saved' : 'local'; persist(); render();
      toast(`已匯入 ${S.accounts.length} 個帳戶`);
    } catch (x) { toast('檔案格式不對，請選本 App 匯出的備份檔'); }
    e.target.value = '';
  };
  rd.readAsText(file);
});
async function doExport() {
  const data = JSON.stringify(S, null, 2);
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: '穩穩存備份_' + todayISO() + '.json', data }); toast('已匯出備份'); return; }
  } catch (x) { if (x && x.code === 'declined') return; }
  try { await navigator.clipboard.writeText(data); toast('已複製備份內容，可貼到記事本保存'); } catch (x) { toast('這個畫面無法下載，請在 claude.ai 打開 App 再匯出'); }
}

let tt; function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2600); }

render();
initStore();
loadFeed();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !(window.claude && window.claude.use)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
