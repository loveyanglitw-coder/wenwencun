name: 更新股價並發布 App

on:
  push:
    branches: [main]            # 修改 App 程式後，公開版與個人版一起重新發布
  schedule:
    # GitHub 排程用 UTC（台灣時間減 8 小時）。平日跑 4 次，抓到當天收盤價後，之後幾次就不會再變動。
    - cron: '40 6 * * 1-5'      # 台灣 14:40
    - cron: '10 8 * * 1-5'      # 台灣 16:10
    - cron: '10 10 * * 1-5'     # 台灣 18:10
    - cron: '10 13 * * 1-5'     # 台灣 21:10
  workflow_dispatch:            # 在 Actions 頁面按「Run workflow」可立即更新
    inputs:
      full_scan:
        description: '掃描全部 ETF 的配息與發放日（約 3～5 分鐘）'
        type: boolean
        default: false
      jp_codes:
        description: '（測試用）指定要抓的日股代號，例如 7203.T,8306.T；空白＝讀個人版持有清單'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取證交所、櫃買中心收盤價與除權息
        run: python scripts/fetch_market.py
        env:
          FULL_SCAN: ${{ github.event.inputs.full_scan }}
          JP_CODES: ${{ github.event.inputs.jp_codes }}
      - id: save
        name: 存回專案
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新股價與除權息 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update-data
    if: always() && (needs.update-data.result == 'skipped' || (needs.update-data.result == 'success' && (needs.update-data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 組出公開版（/）與個人版（/me/）
        run: bash scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
